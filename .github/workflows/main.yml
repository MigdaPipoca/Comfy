name: Build Comfy Project

on:
  push:
    branches: [ "d3d-master" ]
  pull_request:
    branches: [ "d3d-master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Checkout do código
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    # 2. Setup MSBuild
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 3. Setup NuGet
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1

    - name: Restore NuGet Packages
      run: nuget restore Comfy.sln

    # 🔧 4. PATCH AUTOMÁTICO (CORREÇÃO DOS ERROS)
    - name: Fix missing includes (C++ std)
      shell: pwsh
      run: |
        $files = @(
          "ComfyLib/src/Graphics/Auth2D/Aet/AetUtil.cpp",
          "ComfyLib/src/Graphics/Auth2D/Aet/AetSet.h",
          "ComfyLib/src/IO/Stream/MemoryStream.cpp"
        )

        foreach ($file in $files) {
          if (Test-Path $file) {
            $content = Get-Content $file -Raw

            if ($content -notmatch "#include <algorithm>") {
              $content = "#include <algorithm>`r`n" + $content
            }

            if ($content -notmatch "#include <iterator>") {
              $content = "#include <iterator>`r`n" + $content
            }

            Set-Content $file $content
            Write-Host "Patched $file"
          } else {
            Write-Host "File not found: $file"
          }
        }

    # 5. Build
    - name: Build Solution
      run: |
        msbuild Comfy.sln `
          -property:Configuration=Release `
          -property:Platform="x64" `
          -property:WindowsTargetPlatformVersion=10.0 `
          -property:PlatformToolset=v143 `
          -maxCpuCount

    # 6. Upload do build (opcional mas útil)
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ComfyBuild
        path: |
          **/bin/x64-Release/**
      
    - name: Fix Windows min/max macro conflict
      shell: pwsh
      run: |
          $files = Get-ChildItem -Recurse -Include *.cpp,*.h

          foreach ($file in $files) {
          $content = Get-Content $file -Raw
    
          if ($content -notmatch "#define NOMINMAX") {
            $content = "#define NOMINMAX`r`n" + $content
          }
    
          Set-Content $file $content
              }


          /p:TreatWarningsAsErrors=false
